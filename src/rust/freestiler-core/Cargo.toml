[package]
name = "freestiler-core"
version = "0.1.0"
edition = "2021"
# geo 0.33 requires 1.88. This fork drops upstream's 1.77.2 MSRV, which existed
# to satisfy CRAN's Rust compatibility checks; see the note in [dependencies].
rust-version = "1.88"
description = "Core Rust engine for building PMTiles vector tilesets"
license = "MIT"
homepage = "https://walker-data.com/freestiler/"
documentation = "https://walker-data.com/freestiler/articles/maplibre-tiles.html"
repository = "https://github.com/walkerke/freestiler"
publish = false

[features]
default = []
geoparquet = ["dep:parquet", "dep:arrow-array", "dep:arrow-schema", "dep:geozero"]
duckdb = ["dep:duckdb", "dep:geozero"]
fastpfor = ["dep:fastpfor"]
fsst = ["dep:fsst-rs"]

# Upstream pinned several transitive crates with `=` requirements, and carried
# spade/indexmap/rayon-core/jobserver as unused direct dependencies, purely to
# hold the tree at Rust 1.77.2 for CRAN. This fork targets WASM consumers
# (opengeos/geolibre-rust) rather than CRAN, so those pins are dropped: they
# make freestiler-core unresolvable alongside any dependent on a newer rayon or
# geo. Do not reintroduce them without checking downstream resolution.

[dependencies]
# Geometry operations
geo = "0.33"
geo-types = "0.7"

# Protobuf encoding for MVT
prost = "0.13"

# PMTiles archive writing
pmtiles2 = "=0.3.1"

# Varint encoding for MLT format
integer-encoding = "4"

# Gzip compression
flate2 = "1"

# JSON metadata
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Parallel tile encoding. Degrades to sequential execution on wasm targets,
# which have no threads to spawn.
rayon = "1"

# GeoParquet file input (optional)
parquet = { version = "57", optional = true, default-features = false, features = ["arrow", "snap"] }
arrow-array = { version = "57", optional = true }
arrow-schema = { version = "57", optional = true }

# WKB geometry parsing (shared by geoparquet and duckdb features)
geozero = { version = "0.13", optional = true, features = ["with-wkb", "with-geo"] }

# DuckDB file input (optional)
duckdb = { version = "1.2", optional = true, features = ["bundled"] }

# Advanced MLT encodings (optional)
fastpfor = { version = "0.7", optional = true }
fsst-rs = { version = "0.5", optional = true }

[dev-dependencies]
# MapLibre reference MLT decoder — used for conformance fixture tests
mlt-core = "0.1.2"
